services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: fraud_detection
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  ml-service:
    build: ./ml-service
    ports:
      - "8000:8000"
  backend:
    build: ./backend
    ports:
      - "8081:8081"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/fraud_detection
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      ML_URL: http://ml-service:8000
    depends_on:
      mysql:
        condition: service_healthy
      ml-service:
        condition: service_started
volumes:
  mysql_data: